<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- საჩუქრის ყუთი სანტას ქუდით, ჭყეტელა თვალებით და წვერით -->
  <ellipse cx="100" cy="186" rx="62" ry="8" fill="#000" opacity=".15"/>
  <!-- box -->
  <rect x="42" y="92" width="116" height="88" rx="10" fill="#e63946"/>
  <rect x="91" y="92" width="18" height="88" fill="#ffd166"/>
  <!-- beard -->
  <path d="M46 136 q12 30 30 34 q10 12 24 6 q14 6 24 -6 q18 -4 30 -34 q-14 10 -26 6 q-10 -10 -28 -4 q-18 -6 -28 4 q-12 4 -26 -6z" fill="#fff"/>
  <!-- moustache -->
  <path d="M100 132 q-10 -10 -24 -4 q-10 6 -18 0 q6 14 22 12 q12 -2 20 -8 q8 6 20 8 q16 2 22 -12 q-8 6 -18 0 q-14 -6 -24 4z" fill="#f1f1f1" stroke="#ddd" stroke-width="1"/>
  <!-- grin -->
  <path d="M86 142 q14 14 28 0 q-14 6 -28 0z" fill="#7a1020"/>
  <!-- googly eyes -->
  <circle cx="76" cy="112" r="13" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <circle cx="81" cy="116" r="6" fill="#222"/>
  <circle cx="124" cy="110" r="15" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <circle cx="118" cy="104" r="6.5" fill="#222"/>
  <!-- blush -->
  <circle cx="58" cy="128" r="6" fill="#ff8fa3" opacity=".7"/>
  <circle cx="142" cy="128" r="6" fill="#ff8fa3" opacity=".7"/>
  <!-- santa hat, tilted -->
  <g transform="rotate(-10 100 92)">
    <path d="M40 92 C50 40 110 8 152 28 C176 40 184 60 180 80 C168 62 152 56 140 60 C150 72 156 84 160 92Z" fill="#c1121f"/>
    <path d="M70 60 C90 36 120 26 146 34" fill="none" stroke="#fff" stroke-width="3" opacity=".25" stroke-linecap="round"/>
    <rect x="34" y="84" width="132" height="20" rx="10" fill="#fff" stroke="#e2e2e2" stroke-width="2"/>
    <circle cx="180" cy="84" r="13" fill="#fff" stroke="#e2e2e2" stroke-width="2"/>
  </g>
  <!-- bow sparkle -->
  <path d="M28 52 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z" fill="#ffd166"/>
  <path d="M176 140 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z" fill="#ffd166"/>
</svg>
